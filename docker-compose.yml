name: ivanbatistamoreno206660-services
services:
  postgres:
    container_name: postgres
    image: postgres:17.4
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      TZ: "America/Cuiaba"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    environment:
      TZ: "America/Cuiaba"
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

  minio:
    container_name: minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      TZ: "America/Cuiaba"
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"

  minio-init:
    container_name: minio-init
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    volumes:
      - ./minio/cors.json:/tmp/cors.json:ro
    environment:
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD; do
        echo 'Aguardando MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$$MINIO_BUCKET_NAME;
      mc cors set local/$$MINIO_BUCKET_NAME /tmp/cors.json;
      "

  backend-api:
    container_name: backend-api
    image: ibmoreno/backend-api:latest
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - minio-init
    ports:
      - "8080:8080"
    environment:
      TZ: "America/Cuiaba"
      SERVER_PORT: 8080
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      JDBC_POSTGRES_URL: ${POSTGRES_URL}
      JDBC_POSTGRES_USER: ${POSTGRES_USER}
      JDBC_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRINGDOC_API_DOCS_ENABLED: true
      SPRINGDOC_SWAGGER_UI_ENABLED: true

  video-processing-worker:
    container_name: video-processing-worker
    build:
      context: .
      dockerfile: worker/video-processing-worker/Dockerfile
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - minio-init
      - backend-api
    restart: unless-stopped
    environment:
      TZ: "America/Cuiaba"
      JDBC_POSTGRES_URL: ${POSTGRES_URL}
      JDBC_POSTGRES_USER: ${POSTGRES_USER}
      JDBC_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      VIDEO_PROCESSING_QUEUE: ${VIDEO_PROCESSING_QUEUE:-video.processing.queue}
      VIDEO_PROCESSING_EXCHANGE: ${VIDEO_PROCESSING_EXCHANGE:-video.processing.exchange}
      VIDEO_PROCESSING_ROUTING_KEY: ${VIDEO_PROCESSING_ROUTING_KEY:-video.processing.process}
      VIDEO_PREVIEW_DURATION_SECONDS: ${VIDEO_PREVIEW_DURATION_SECONDS:-10}
      VIDEO_THUMBNAIL_SECOND: ${VIDEO_THUMBNAIL_SECOND:-5}
      VIDEO_SEGMENT_DURATION_SECONDS: ${VIDEO_SEGMENT_DURATION_SECONDS:-4}

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
